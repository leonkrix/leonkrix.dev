name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository
permissions:
  contents: read

# Cancel superseded runs for the same branch or pull request
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  quality:
    name: Lint, format and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build and site checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      # Checks the build output: metadata, legal pages, footer links, contact data not in plain text
      - run: pnpm test:dist
      # The Cloudflare Functions must bundle with the Workers runtime settings (nodejs_compat)
      - run: pnpm build:functions

  # The browser tests run as two jobs at once, each on its own machine and with its own half of the
  # tests (Playwright's --shard splits the list of tests, every test is in exactly one half). The
  # same tests, the same limits, in half the time. The number of halves is written here twice (the
  # matrix and the argument); tests/build-output/ci-shards.test.ts checks that they agree, so that
  # a shard cannot be dropped by accident (its tests would silently not run).
  e2e:
    name: End-to-end tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # A failure in one half does not hide a failure in the other
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Show the Playwright version
        id: playwright
        run: |
          pnpm exec playwright --version
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # The browser (about 150 MB) is downloaded once per Playwright version; its system libraries
      # come from the package manager of the machine every time
      - name: Cache the Playwright browser
        id: browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install the Playwright browser
        if: steps.browser.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the system libraries of the Playwright browser
        if: steps.browser.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # Builds the site, serves it and runs half of the browser tests: smoke, privacy guard, accessibility
      # Playwright stops itself after 15 minutes (playwright.config.ts); this limit is a little above it
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/2
        timeout-minutes: 17
      - name: Upload the Playwright report when tests failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Lighthouse runs as three jobs at once, each with a third of the pages on its own machine: a run
  # is still alone on its machine (running several on one machine disturbs the measurement), and the
  # whole gate takes a third of the time. The number of parts is written twice (matrix and argument),
  # see the comment at the browser tests and tests/build-output/ci-shards.test.ts.
  lighthouse:
    name: Lighthouse (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Builds the site, runs Lighthouse (mobile) three times against each page of its part and
      # checks the scores and the size budgets. Uses the Chrome that is preinstalled on the runner.
      - run: pnpm lighthouse --shard ${{ matrix.shard }}/3
        timeout-minutes: 8
      - name: Upload the Lighthouse report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-report-${{ matrix.shard }}
          path: lighthouse-report/
          retention-days: 7

  # Fails on known vulnerabilities of high or critical severity in any dependency (also dev tools).
  # If an unfixable finding blocks unrelated work, record it in pnpm's audit configuration with a
  # reason instead of weakening this check.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level high

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: 1.7.12
      # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz (from the official release checksums).
      # Update version and checksum together when bumping.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned and checksum verified)
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint workflow files
        run: ./actionlint -color

  # Blocks pull requests that introduce dependencies with known vulnerabilities.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # Single required status check for branch protection.
  # Add new jobs to `needs` and this gate covers them without touching the repository settings.
  # Skipped jobs (dependency-review outside pull requests) do not fail the gate.
  ci-ok:
    name: CI passed
    if: always()
    needs: [quality, test, build, e2e, lighthouse, audit, actionlint, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
