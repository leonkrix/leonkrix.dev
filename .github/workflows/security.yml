name: Security

on:
  push:
    branches: [main]
  # Scorecard re-evaluates when the branch protection changes
  branch_protection_rule:
  schedule:
    # Weekly: new vulnerabilities and new Scorecard checks appear without any code change
    - cron: '41 6 * * 1'
  workflow_dispatch:

# Least privilege: the jobs below add what they need
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OpenSSF Scorecard rates the repository against supply chain and security best practices.
  # The result is published (public repository) so the README can show the badge, and uploaded
  # to the Security tab as code scanning results.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif

  # The same check runs on every pull request in ci.yml. This scheduled run finds vulnerabilities
  # that are published later, while nobody is changing anything.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level high
