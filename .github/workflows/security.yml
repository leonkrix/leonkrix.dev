name: Security

on:
  push:
    branches: [main]
  # Scorecard re-evaluates when the branch protection changes
  branch_protection_rule:
  schedule:
    # Weekly: new vulnerabilities and new Scorecard checks appear without any code change
    - cron: '41 6 * * 1'
  workflow_dispatch:

# Least privilege: the jobs below add what they need
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OpenSSF Scorecard rates the repository against supply chain and security best practices.
  # The result is published (public repository) so the README can show the badge, and uploaded
  # to the Security tab as code scanning results.
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 7

      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif

  # The same check runs on every pull request in ci.yml. This scheduled run finds vulnerabilities
  # that are published later, while nobody is changing anything.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level high
