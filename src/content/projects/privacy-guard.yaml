art: privacy
title: playwright-privacy-guard
subtitle: A Playwright fixture that fails a test when the page leaks
kind: package
start: 2026
stats:
  - value: '15'
    label: checks in every test, from other origins and cookies to weak policies
  - value: '3'
    label: browsers, Chromium, Firefox and WebKit, on every change
  - value: '0'
    label: runtime dependencies
highlights:
  - Fails a test on a request to another origin, a cookie, anything stored on the device, a policy violation or an error on the page. The message names the host, the cookie or the script, the company behind it, and the setting that would allow it if it is meant.
  - Extracted from the browser tests of this site, where it now watches every test. Canary tests make a page misbehave on purpose, and everything a test allows is listed with its reason.
  - Tried on 29 public pages in three browsers next to a record that Playwright keeps without the package. Nothing the browser did was missing from the report, and the four faults the trial found are fixed. The same scan runs without a test as `npx playwright-privacy-guard scan <address>`.
  - Released like a product, with semantic versioning, a changelog, CI on three browsers including the oldest supported Playwright, and publishing from GitHub Actions with npm provenance that only goes live when I approve it with two-factor authentication.
technologies: [typescript, playwright, vitest, cicd, npm, git, eslint, prettier]
