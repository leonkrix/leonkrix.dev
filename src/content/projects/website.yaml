highlights:
  - Static portfolio built with Astro, TypeScript, React islands and Tailwind CSS, hosted on Cloudflare. Its content is typed YAML that is validated at build time, so a typo fails the build instead of shipping.
  - Every change goes through a pull request and automated gates before it goes live, from linting, type checks and unit tests to build-output checks (security headers, CSP, legal pages), end-to-end tests with accessibility scans, Lighthouse budgets, CodeQL, dependency review and OpenSSF Scorecard. After the deployment a live check of the published site (headers, redirects, legal pages, contact form, certificate, domain, mail DNS) runs every few hours, plus a weekly link check.
  - A contact form without any third-party service. A Cloudflare Function validates the message with the same rules as the browser, checks origin, a signed time token, a honeypot and a rate limit, and hands it to my own mailbox over SMTP.
  - Privacy and security by design with a strict content security policy, HSTS, no cookies of its own, self-hosted fonts and obfuscated contact data.
  - A small Playground of browser games with logic written as tested pure functions, hundreds of own tech terms with definitions, keyboard play, accessible results and animations that respect reduced motion, and a promise that is checked by tests, that nothing is stored on the device.
