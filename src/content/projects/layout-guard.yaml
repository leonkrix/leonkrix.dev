art: guard
title: playwright-layout-guard
subtitle: A Playwright fixture that fails a test when the page moves
kind: package
start: 2026
stats:
  - value: '3'
    label: browsers, Chromium, Firefox and WebKit, on every change
  - value: '0'
    label: runtime dependencies
  - value: '440'
    label: faults injected to compare it with the guard it replaced (same result)
highlights:
  - Fails a test when an element moves or changes size after the page has loaded, and names the element, how far it moved and when. It also sees what the layout shift score of Lighthouse leaves out, such as shifts after a click.
  - Extracted from the browser tests of this site, and tried on 23 public sites next to the layout shift measurement of the browser. The false alarms of the first versions are rules with tests now.
  - Works without a test as well. A command line, `npx playwright-layout-guard scan <address>`, lists what moved next to the browser's own score, saves a picture of the moved boxes and ends with an exit code for a pipeline.
  - Released like a product, with semantic versioning, a changelog, CI on three browsers including the oldest supported Playwright, and publishing from GitHub Actions with npm provenance that only goes live when I approve it with two-factor authentication.
technologies: [typescript, playwright, vitest, cicd, npm, git, eslint, prettier]
