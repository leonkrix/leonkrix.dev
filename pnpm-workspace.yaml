allowBuilds:
  esbuild: true
  workerd: true
# pnpm does not install a version that is younger than its minimum release age. playwright-privacy-guard
# is my own package and 0.2.0 was published on 2026-10-28: delete this entry once pnpm installs it
# without it (a few days after the release).
minimumReleaseAgeExclude:
  - playwright-privacy-guard@0.2.0
# miniflare (inside wrangler) pins undici 7.29.1 exactly, and 7.29.1 has known denial of service
# findings (patched in 7.30.1; found by pnpm audit on 2026-10-24). Written as a range of the bad
# versions, so it does nothing once miniflare asks for a patched version itself: then delete it.
overrides:
  'undici@>=7.0.0 <7.30.1': 7.30.1
